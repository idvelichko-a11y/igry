<!doctype html>
<html lang="uk" data-ver="2">
<head>

<title>Майстерня</title>

<style>
:root{--bg:#EEF1EE;--card:#FFFFFF;--fg:#2C3E50;--mute:#5E737A;--line:#C5CFD2;--main:#1F4E5F;--acc:#C9A961;--acc2:#E3C77F;--soft:#FFF7E2;--ok:#2E7D4F;--bad:#B0412E;--tray:#D9E0DD;--chip:#E6ECE9;
 --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--fh:"Unbounded","Manrope",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1E;--card:#18252B;--fg:#E6ECEE;--mute:#9BABB2;--line:#2E4048;--main:#8CC0D1;--soft:#2A2717;--tray:#15232A;--chip:#22333A;--ok:#7FD18A;--bad:#F08A78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1E;--card:#18252B;--fg:#E6ECEE;--mute:#9BABB2;--line:#2E4048;--main:#8CC0D1;--soft:#2A2717;--tray:#15232A;--chip:#22333A;--ok:#7FD18A;--bad:#F08A78;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0;height:100%} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.4;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1F4E5F;color:#fff;min-height:56px;flex:0 0 auto}
.top .grow{flex:1;min-width:0} .top .t1{font-weight:800;font-size:15px;line-height:1.2} .top .t2{font-size:12px;color:#CFE0E5}
.top .cash{font-weight:800;font-size:16px;color:var(--acc2);text-align:right;white-space:nowrap;line-height:1.15} .top .cash small{display:block;font-size:11.5px;color:#CFE0E5;font-weight:700}
.top .neg{color:#FFB3A6}
.ib{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;min-width:40px;height:40px;font-size:18px}
.hrs{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:4px;overflow:hidden;max-width:180px} .hrs i{display:block;height:100%;background:var(--acc2)}
.scroll{flex:1;overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);flex:0 0 auto}
.tabs button{border:0;background:none;padding:7px 2px 8px;font-size:11.5px;font-weight:800;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;position:relative}
.tabs button b{font-size:19px;line-height:1.1;font-weight:400} .tabs button.on{color:var(--main)} .tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--acc);border-radius:0 0 3px 3px}
.tabs .bd{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bad);color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
h2.sec{font-family:var(--fh);font-size:17px;color:var(--main);margin:6px 0 0;font-weight:700} .sub{font-size:12.5px;color:var(--mute);margin-top:-6px}

.card.hot{border-color:var(--acc);border-width:2px}
.mh{display:flex;gap:12px;align-items:center;min-width:0} .mh svg.sil{width:112px;height:auto;flex:0 0 auto} .mh .grow{min-width:0;flex:1}
.mh b.nm{display:block;font-size:15.5px;color:var(--main)} .mh .s{font-size:12.5px;color:var(--mute)}
.cmp{font-size:15px;font-weight:700;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap} .chip{background:var(--chip);border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:700} .chip.g{background:var(--soft);color:var(--fg);border:1px solid var(--acc2)} .chip.r{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)} .chip.o{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.btns{display:flex;gap:8px;flex-wrap:wrap} .btns button,.bt{flex:1 1 120px;min-height:44px;border-radius:22px;border:1.3px solid var(--line);background:var(--card);font-weight:800;font-size:14px;padding:0 12px}
.btns button.main,.bt.main{background:var(--acc);border-color:var(--acc);color:#1B2A30} .btns button:disabled,.bt:disabled{opacity:.42;cursor:default}
.bt.sm{flex:0 0 auto;min-height:38px;font-size:13px;padding:0 12px}
.hint{background:var(--soft);border:1px solid var(--acc2);border-radius:12px;padding:8px 10px;font-size:13.5px} .hint b{color:var(--main)} .src{font-size:11.5px;color:var(--mute)}
.cz{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px 10px;align-items:start;border-top:1px dashed var(--line);padding-top:10px}

.res{font-size:12.5px;font-weight:800} .res.ok{color:var(--ok)} .res.bad{color:var(--bad)} .res.m{color:var(--mute)}
.prog{height:8px;background:var(--chip);border-radius:4px;overflow:hidden} .prog i{display:block;height:100%;background:var(--acc)}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.row .ic{width:48px;height:48px} .row b{display:block;font-size:14px} .row small{display:block;font-size:12px;color:var(--mute)} .row .n{font-weight:800;font-size:15px;text-align:right}
.rows{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:14px} .rows span{color:var(--mute)} .rows b{text-align:right}
.off{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px 10px;border:1.3px solid var(--line);border-radius:14px;padding:10px}
.off .ic{width:52px;height:52px} .off .br{font-weight:800} .off .pr{font-size:17px;font-weight:800;color:var(--main)} .off small{display:block;color:var(--mute);font-size:12px} .off .btns{grid-column:1/-1}
.off.trap{border-style:dashed}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,20,24,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--bg);color:var(--fg);border-radius:18px 18px 0 0;max-width:640px;width:100%;max-height:92%;overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.ov{align-items:center;padding:20px}.sheet{border-radius:18px}}
.sheet h3{margin:0;font-family:var(--fh);font-size:18px;color:var(--main);font-weight:700} .sheet .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:800}
.news{display:flex;flex-direction:column;gap:6px} .news div{background:var(--card);border-left:4px solid var(--acc);border-radius:8px;padding:7px 10px;font-size:13.5px}
.toast{pointer-events:none;position:fixed;left:12px;right:12px;bottom:calc(116px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;background:var(--soft);border:1.5px solid var(--acc);color:var(--fg);border-radius:12px;padding:9px 12px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:60}
.toast.bad{border-color:var(--bad)} .toast.ok{border-color:var(--ok)}
.hero{background:#1F4E5F;color:#fff;border-radius:16px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-family:var(--fh);font-size:clamp(24px,7vw,32px);margin:0;font-weight:700} .hero .k{color:var(--acc2);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.hero .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px} .hero svg{width:100%;height:auto}
.leg{font-size:13px;display:grid;grid-template-columns:26px 1fr;gap:4px 8px} .leg b{color:var(--main);text-align:center}
.stars{font-size:36px;letter-spacing:.14em;color:var(--acc);text-align:center} .stars .o{color:var(--line)}
.asm{display:flex;flex-wrap:wrap;gap:6px;min-height:60px;align-items:center;background:var(--tray);border-radius:12px;padding:8px}
.asm .pc{display:flex;flex-direction:column;align-items:center;width:64px;font-size:10px;font-weight:700;text-align:center;line-height:1.15}
.asm .pc .ic{width:44px;height:44px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{background:var(--card);border:1.4px solid var(--line);border-radius:12px;padding:5px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:700;text-align:center;min-height:90px;line-height:1.2}
.tile .ic{width:46px;height:46px} .tile.bad{animation:sh .35s;border-color:var(--bad)} @keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.empty{color:var(--mute);font-size:13.5px;text-align:center;padding:14px}
.foot{font-size:12px;color:var(--mute);text-align:center}

.tms{display:flex;gap:6px;overflow-x:auto;padding:6px max(10px,env(safe-area-inset-left,0px));background:#173E4B;flex:0 0 auto;scrollbar-width:none}
.tmr{flex:0 0 auto;min-width:118px;max-width:170px;border:0;border-radius:10px;background:#245868;color:#fff;padding:5px 8px;text-align:left;font-size:11px;line-height:1.2}
.tmr span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#CFE0E5} .tmr b{display:block;font-family:var(--fh);font-size:14px;color:var(--acc2);font-weight:700}
.tmr i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:3px;overflow:hidden} .tmr i u{display:block;height:100%;background:var(--acc2)}
.tmr.low b{color:#FFB3A6} .tmr.low i u{background:#FFB3A6} .tmr.rep b{color:#9EE6AE} .tmr.rep i u{background:#9EE6AE} .tmr.del b{color:#CFE0E5} .tmr.yd{background:#3A5560}
.ffb{flex:0 0 auto;border:0;background:var(--acc);color:#1B2A30;font-weight:800;font-size:14px;min-height:46px;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
.jc{text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.story{font-size:14px;color:var(--mute)}
.stage{background:var(--chip);border-radius:16px;padding:4px} .stage svg{display:block;width:100%;height:auto;max-height:300px}
.pt{cursor:pointer} .pt circle.r{fill:#fff;stroke:#C9A961;stroke-width:3;animation:pu 1.4s infinite} .pt text{font:800 13px var(--f);fill:#1F4E5F;pointer-events:none}
.pt.seen circle.r{animation:none;fill:#BFE3C8;stroke:#2E7D4F} .pt.bad circle.r{animation:none;fill:#F6C9C0;stroke:#B0412E} .pt.bad text{fill:#B0412E}
@keyframes pu{50%{stroke-width:7;stroke-opacity:.5}}
.probes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.pr{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:center;text-align:left;border:1.4px solid var(--line);background:var(--card);border-radius:12px;padding:6px 8px;min-height:48px}
.pr .tg{font-size:20px;text-align:center} .pr b{display:block;font-size:13px} .pr small{display:block;font-size:12px;color:var(--mute)}
.pr.seen{border-color:var(--ok)} .pr.bad{border-color:var(--bad)} .pr.bad small{color:var(--bad);font-weight:700} .pr.seen small{color:var(--ok)}
.kk{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-weight:800}
.rules{display:flex;flex-direction:column;gap:5px;font-size:13.5px} .rq{font-weight:700} .br{display:grid;grid-template-columns:1fr 1fr;gap:6px} .b{border:1.4px dashed var(--line);border-radius:9px;padding:4px 8px;font-size:12.5px;color:var(--mute)}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.su{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px;font-size:12.5px;line-height:1.25}
.su .ic{width:42px;height:42px} .su small{color:var(--mute);font-size:11.5px} .su em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--mute)} .su.cold{opacity:.42} .su.hot{border-color:var(--ok);border-width:2.4px} .su.hot em{color:var(--ok)}
.su:disabled{opacity:.5}
.read{font-size:17px;font-weight:800;text-align:center} .read.bad{color:var(--bad)} .read.ok{color:var(--ok)}
svg.sc{width:100%;max-height:170px;height:auto}
.ndl{transform-origin:100px 110px;transform:rotate(-90deg);animation:nd 1s ease-out forwards} @keyframes nd{to{transform:rotate(var(--to))}}
.drop{animation:dr .9s ease-in both} @keyframes dr{from{transform:translateY(-30px);opacity:0}}
.rise{transform-origin:100px 116px;animation:rs 1s ease-out both} @keyframes rs{from{transform:scaleY(.05)}}
.spin{animation:sp 1.4s ease-in-out forwards} @keyframes sp{to{transform:rotate(250deg)}}
.wob{animation:wb .18s 6 linear} @keyframes wb{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.wave{stroke-dasharray:400;stroke-dashoffset:400;animation:wv 1s linear forwards} @keyframes wv{to{stroke-dashoffset:0}}
.mag{animation:mg 1s ease-in-out} @keyframes mg{0%{transform:translateX(-40px)}100%{transform:none}}
.cnt{animation:bl .25s 4 steps(2)} @keyframes bl{50%{opacity:0}}
.nb{background:var(--card);border:1.4px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.nb .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:800}
.nw{background:var(--card);border-left:4px solid var(--acc);border-radius:8px;padding:6px 10px;font-size:13.5px} .nw.bad{border-left-color:var(--bad)} .nw.ok{border-left-color:var(--ok)}
.off .brn{font-weight:800} .off .prc{font-size:17px;font-weight:800;color:var(--main)} .off small b{display:inline}
.n{text-align:right;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<div id="app"></div>
<script>
/* Рисунки деталей і силуети — свої, нейтральні; viewBox 0 0 64 64 */
(function(root){
"use strict";
const S='#1F4E5F', M='#C9D3D6', M2='#AEBBBF', D='#7F8C8D', P='#EFE7CF', PL='#B49A55', R='#2F3538', W='#F4F8F9';
const st=(w)=>` stroke="${S}" stroke-width="${w||1.8}" stroke-linejoin="round" stroke-linecap="round"`;
const pleats=(x0,x1,y0,y1,n)=>{ let s=''; for(let i=0;i<n;i++){ const x=x0+(x1-x0)*(i+.5)/n; s+=`<path d="M${x} ${y0}V${y1}" stroke="${PL}" stroke-width="1.3"/>`; } return s; };
const PARTS={
 air:()=>`<rect x="8" y="18" width="48" height="28" rx="14" fill="${P}"${st()}/>${pleats(14,52,20,44,9)}<ellipse cx="9" cy="32" rx="4" ry="13" fill="${M2}"${st(1.5)}/><circle cx="9" cy="32" r="4" fill="${W}"${st(1.2)}/>`,
 air_small:()=>`<rect x="14" y="23" width="38" height="18" rx="9" fill="${W}"${st()}/>${pleats(19,49,25,39,7)}<ellipse cx="15" cy="32" rx="3" ry="8.5" fill="${M2}"${st(1.4)}/>`,
 spin:()=>`<rect x="18" y="12" width="28" height="42" rx="5" fill="${M}"${st()}/><rect x="18" y="12" width="28" height="8" rx="3" fill="${M2}"${st(1.5)}/><path d="M22 26h20M22 32h20M22 38h20M22 44h20" stroke="${D}" stroke-width="1"/><circle cx="32" cy="16" r="2" fill="${S}"/>`,
 spin_big:()=>`<rect x="13" y="8" width="38" height="50" rx="6" fill="${M}"${st()}/><rect x="13" y="8" width="38" height="9" rx="3" fill="${M2}"${st(1.5)}/><path d="M18 24h28M18 31h28M18 38h28M18 45h28" stroke="${D}" stroke-width="1"/><circle cx="32" cy="12.5" r="2.4" fill="${S}"/><rect x="22" y="48" width="20" height="4" rx="1" fill="${D}"/>`,
 fuel:()=>`<rect x="20" y="10" width="24" height="44" rx="4" fill="${P}"${st()}/>${pleats(23,41,16,48,6)}<rect x="20" y="10" width="24" height="6" rx="2" fill="${M2}"${st(1.4)}/><rect x="20" y="48" width="24" height="6" rx="2" fill="${M2}"${st(1.4)}/><circle cx="32" cy="58" r="2.5" fill="#D8A93F"${st(1.2)}/>`,

 knife:()=>`<path d="M14 50 L32 10 L50 50 Z" fill="${M}"${st()}/><path d="M18 46 L32 16 M46 46 L32 16" stroke="${D}" stroke-width="1" stroke-dasharray="2 2"/><circle cx="26" cy="44" r="2.4" fill="${W}"${st(1.2)}/><circle cx="38" cy="44" r="2.4" fill="${W}"${st(1.2)}/>`,
 cyl:()=>`<rect x="6" y="24" width="34" height="16" rx="3" fill="${M}"${st()}/><rect x="40" y="29" width="16" height="6" fill="${W}"${st(1.5)}/><circle cx="8" cy="32" r="6" fill="${M2}"${st(1.5)}/><circle cx="8" cy="32" r="2.5" fill="${W}"/><circle cx="57" cy="32" r="5" fill="${M2}"${st(1.5)}/><circle cx="57" cy="32" r="2" fill="${W}"/><rect x="24" y="20" width="6" height="4" fill="${D}"/>`,

 між ними — 10,4 мм."}]},"У0403-01":{"id":"charge","name":"Насос підживлення (героторний)","src":"Р (сервісне керівництво 7-88436 «2100/2300»), стор. 1400, 1229 (G4-126) + будова вузла","intro":"Героторний насос на торці гідронасоса: подає оливу на підживлення, керування й охолодження.","parts":[{"part":"hydpump","name":"Корпус гідронасоса","step":1,"why":"Основа: насос підживлення кріпиться на його торці."},{"part":"shaft","name":"Вал із привідним штифтом","step":2,"why":"Передає обертання від вала гідронасоса."},{"part":"gear_in","name":"Внутрішній ротор героторної пари","step":3,"why":"Сідає на штифт вала."},{"part":"gear_out","name":"Зовнішній ротор героторної пари","step":4,"why":"Обіймає внутрішній ротор."},{"part":"spacer","name":"Проставка","step":5,"why":"Її товщина задає подачу насоса."},{"part":"oring","name":"Ущільнювальне кільце","step":6,"why":"Між проставкою й кришкою."},{"part":"drum","name":"Кришка насоса підживлення","step":7,"why":"Закриває героторну секцію."},{"part":"valve","name":"Запобіжний клапан підживлення","step":8,"why":"Тримає 230±10 psi; заводський, не регулюється."}]}},"src":"Посібник"}},"quest":{"tools":{"eye":["👁","огляд",0.2],"dip":["💧","щуп / олива",0.3],"ear":["👂","слухати",0.2],"hand":["✋","люфт рукою",0.4],"meter":["⚡","мультиметр",0.5],"thermo":["🌡","температура",0.4],"gauge":["⏲","манометр",0.8],"tape":["✂","мітка на валу",0.6],"scan":["▤","коди блока",0.4]},"q":{"jd8430-01":{"story":"Від двигуна обертання йде в коробку PowerShift, далі валом — у задній міст і до коліс. Десь у цьому ланцюгу воно губиться.","rules":[["Вал від коробки до моста цілий і з’єднаний?","так → далі","ні → міняти вал"],["Наклей стрічку-мітку на вал, двигун, 1-ша передача, гальма. Стрічка зрушила?","так → шукай у задньому мості","ні → шукай у коробці"]],"probes":[{"tool":"eye","zone":"trans","name":"привідний вал","ok":"Вал цілий, фланці затягнуті.","bad":{"0":"Фланець вала роз’єднаний, болти зрізані."}},{"tool":"tape","zone":"trans","name":"мітка на валу","ok":"Стрічка зрушила — вал від коробки крутиться.","bad":{"2":"Стрічка на місці — вал не крутиться.","0":"Стрічка не зрушила: вал роз’єднаний."}},{"tool":"dip","zone":"rear","name":"олива заднього моста","ok":"Олива чиста.","bad":{"1":"В оливі блискуча стружка."}}],"why":["Привідний вал передає обертання від коробки до заднього моста. Фланець роз’єднався — коробка крутить, а до коліс не доходить.","Диференціал ділить обертання між задніми колесами. Зруйнувався всередині — вал крутиться, колеса стоять, в оливі стружка.","Вал від коробки не крутиться — отже несправність у самій коробці PowerShift. Далі її власна діагностика, розділ 213."]},"jd8430-02":{"story":"МППК — передній ведучий міст. Його вмикає муфта, а муфту — соленоїдний клапан за сигналом із кабіни.","rules":[["Функціональна перевірка: лампа МППК горить, а міст не тягне?","так → коло соленоїда","ні → механіка"],["Тиск в елементі муфти МППК у нормі?","так → карданний вал","ні → муфта тече всередині"]],"probes":[{"tool":"meter","zone":"front","name":"соленоїд МППК","ok":"Напруга на соленоїді є, опір у нормі.","bad":{"0":"На соленоїді 12 В, а котушка в обриві."}},{"tool":"gauge","zone":"front","name":"тиск муфти МППК","ok":"Тиск муфти в нормі.","bad":{"1":"Тиск муфти низький і падає — тече всередині.","0":"Тиску немає — клапан не відкривається."}},{"tool":"eye","zone":"front","name":"карданний вал МППК","ok":"Кардан цілий.","bad":{"2":"Хрестовина кардана розбита, вал люфтить."}}],"why":["Соленоїдний клапан відкриває оливу до муфти. Котушка в обриві — сигнал є, а муфта не вмикається.","Муфта МППК тисне диски оливою. Ущільнення пропускають — тиск падає, міст пробуксовує й вимикається.","Карданний вал несе обертання до переднього моста. Розбита хрестовина — муфта ввімкнена, а тяги немає."]},"jd8430-03":{"story":"Задній ВВП крутить знаряддя. Його муфту стискає олива під тиском, плавність дає окремий клапан.","rules":[["Після калібрування ВВП усе одно буксує?","так → тиск елемента муфти","ні → було калібрування"],["Тиск усієї системи коробки в нормі?","так → муфта або клапан ВВП","ні → причина в коробці"]],"probes":[{"tool":"gauge","zone":"rear","name":"тиск муфти ВВП","ok":"Тиск муфти ВВП у нормі.","bad":{"0":"Тиск муфти ВВП низький, система — в нормі.","2":"Тиск низький і на муфті, і в усій системі."}},{"tool":"gauge","zone":"trans","name":"тиск системи коробки","ok":"Тиск системи в нормі.","bad":{"2":"Тиск системи коробки нижчий за норму."}},{"tool":"scan","zone":"cab","name":"коди блока ВВП","ok":"Кодів немає.","bad":{"1":"Код: клапан плавного ввімкнення поза межами."}}],"why":["Муфта ВВП тисне пакет дисків оливою. Течія в елементі — тиск падає, під навантаженням диски ковзають.","Клапан плавного ввімкнення дозує тиск на муфту. Працює неправильно — муфта не дотискається.","Тиску немає в усій системі коробки — ВВП тут ні до чого. Шукають у коробці, розділ 213."]},"jd8430-04":{"story":"ВВП вимикається соленоїдним клапаном за командою блока керування.","rules":[["Коди блока керування є?","так → калібрувати й обробити коди","ні → коло соленоїда"]],"probes":[{"tool":"scan","zone":"cab","name":"коди блока ВВП","ok":"Кодів немає.","bad":{"1":"Коди: калібрування ВВП не завершене."}},{"tool":"ear","zone":"rear","name":"клапан ВВП при вимиканні","ok":"Клапан клацає, ВВП зупиняється.","bad":{"0":"Клапан не клацає — заїв."}}],"why":["Соленоїдний клапан ВВП заїв відкритим — олива тисне муфту, хоч вимикач уже вимкнено.","Блок керування не завершив калібрування — команда «стоп» не доходить. Калібрують і обробляють коди."]},"jd8430-05":{"story":"Підвіска ILS тримає передній міст на оливі й азоті в гідроакумуляторах. Висоту задає клапан підвіски.","rules":[["Клапан підвіски перемикається на опускання?","так → акумулятори й редукційний клапан","ні → клапан підвіски"],["Тиск після редукційного клапана тримається?","так → акумулятори","ні → редукційний клапан"]],"probes":[{"tool":"meter","zone":"front","name":"клапан підвіски","ok":"Клапан перемикається.","bad":{"0":"Клапан підвіски не перемикається на опускання."}},{"tool":"hand","zone":"front","name":"гідроакумулятори","ok":"Акумулятори пружинять.","bad":{"1":"Акумулятор «мертвий» — не пружинить, азот вийшов."}},{"tool":"gauge","zone":"front","name":"тиск після редукційного клапана","ok":"Тиск тримається.","bad":{"2":"Тиск після редукційного клапана падає."}}],"why":["Клапан підвіски перемикає підйом і опускання. Заїв у положенні «вгору» — міст піднімається, але не опускається.","У гідроакумуляторах азот під тиском. Він вийшов — підвіска стає жорсткою і не тримає висоту.","Редукційний клапан знижує тиск для підвіски. Не тримає — висота «гуляє»."]},"jd8430-06":{"story":"Кермо працює від головного гідронасоса через блок рульового керування. Пріоритет керму дає контур відстеження навантаження.","rules":[["Тиск контуру відстеження навантаження в нормі?","так → блок керма або циліндр","ні → контур або насос"],["Тиск головного насоса в нормі?","так → контур відстеження","ні → насос"]],"probes":[{"tool":"gauge","zone":"hyd","name":"тиск головного насоса","ok":"Тиск головного насоса в нормі.","bad":{"2":"Тиск головного насоса низький."}},{"tool":"gauge","zone":"front","name":"тиск контуру навантаження","ok":"Тиск контуру в нормі.","bad":{"1":"Тиск контуру низький, насос у нормі.","2":"Тиск контуру низький."}},{"tool":"hand","zone":"front","name":"кермо при упорі","ok":"Кермо тримає.","bad":{"3":"Кермо повільно «пливе» з упору — тече циліндр.","0":"Кермо туге й нерівне, з ривками."}}],"why":["Блок рульового керування дозує оливу до циліндра. Зношений — кермо туге, з ривками.","Контур відстеження навантаження «кличе» насос. Забитий — насос не знає, що кермо просить оливу.","Головний насос дає оливу для керма, навіски й SCV. Зношений — тиску мало всюди.","Циліндр керма повертає колеса. Ущільнення тече — кермо «пливе» з упору."]},"jd8430-07":{"story":"Задню навіску піднімає циліндр оливою від головного насоса через клапан навіски.","rules":[["Тиск головного насоса в нормі?","так → клапан навіски або механіка","ні → насос або фільтр"],["Важелі навіски ходять вільно, якщо зняти навантаження?","так → клапан навіски","ні → механічне заклинювання"]],"probes":[{"tool":"gauge","zone":"hyd","name":"тиск головного насоса","ok":"Тиск у нормі.","bad":{"0":"Тиск насоса низький, фільтр чистий.","3":"Тиск низький, на фільтрі горить сигнал перепаду."}},{"tool":"eye","zone":"hyd","name":"гідравлічний фільтр","ok":"Фільтр чистий.","bad":{"3":"Фільтр забитий, корпус у бруді."}},{"tool":"hand","zone":"rear","name":"важелі навіски","ok":"Важелі ходять вільно.","bad":{"2":"Важіль заклинило в шарнірі."}},{"tool":"meter","zone":"rear","name":"клапан навіски","ok":"Клапан навіски відповідає.","bad":{"1":"Клапан навіски не відповідає на команду."}}],"why":["Головний насос дає тиск для навіски. Зношений — навіска не має сили піднятись.","Клапан навіски направляє оливу в циліндр. Несправний — команда є, руху немає.","Шарнір навіски заклинило — гідравліка тисне, а важелі стоять. Ремонт без деталі.","Забитий фільтр душить потік оливи до насоса — тиск падає."]},"jd8430-08":{"story":"Навіска тримає вантаж на замкненій оливі в циліндрі. Якщо десь тече всередині — вантаж повільно опускається.","rules":[["Заглушити трійник, манометр на гніздо клапана, олива не нижче 55 °C. Тиск падає?","так → циліндр","ні → клапан навіски"]],"probes":[{"tool":"gauge","zone":"rear","name":"тиск на гнізді клапана","ok":"Тиск тримається.","bad":{"0":"Тиск падає з заглушеним трійником — тече циліндр."}},{"tool":"thermo","zone":"hyd","name":"температура оливи","ok":"Олива 58 °C — можна міряти.","bad":{}},{"tool":"ear","zone":"rear","name":"клапан навіски під вантажем","ok":"Тихо.","bad":{"1":"У клапані навіски чути шипіння."}}],"why":["Підйомний циліндр тримає вантаж. Ущільнення поршня зносилося — олива перетікає, вантаж опускається.","Клапан навіски замикає оливу в циліндрі. Тече в клапані — вантаж опускається, а циліндр цілий."]},"jd8430-09":{"story":"У нейтралі тиск відстеження навантаження має падати до 800 кПа, щоб насос відпочивав.","rules":[["Зняти зворотний клапан у рамі навіски. Тиск у нейтралі впав до норми?","так → зворотний клапан","ні → секція SCV"]],"probes":[{"tool":"gauge","zone":"rear","name":"тиск у нейтралі","ok":"Тиск у нейтралі 800 кПа.","bad":{"0":"Без зворотного клапана тиск упав до 800 кПа.","1":"Тиск у нейтралі високий і без зворотного клапана."}},{"tool":"eye","zone":"hyd","name":"секції SCV","ok":"Секції сухі.","bad":{"1":"Одна секція SCV підтікає по золотнику."}}],"why":["Зворотний клапан вимірювання навантаження заїв — тримає тиск, і насос не відпочиває.","Секція SCV не повертається в нейтраль — насос думає, що знаряддя просить оливу."]},"jd8430-10":{"story":"Шланг знаряддя тримає швидкороз’ємна муфта SCV. Якщо в ній тиск або вона зношена — шланг вибиває.","rules":[["Під’єднати шланг до іншого SCV. Вибиває?","так → шланг знаряддя","ні → ця муфта або її злив"]],"probes":[{"tool":"hand","zone":"hyd","name":"муфта SCV","ok":"Муфта фіксується.","bad":{"2":"Кульки муфти зношені, фіксатор не тримає.","0":"Муфта не фіксується, поки в ній олива."}},{"tool":"eye","zone":"hyd","name":"зливний шланг","ok":"Злив чистий.","bad":{"1":"Зливний шланг забитий."}}],"why":["У муфті лишилась олива під тиском — шланг не сів до кінця. Під’єднують із відтиснутим важелем.","Злив з блока клапанів забитий — олива не йде, тиск штовхає шланг.","Кульки муфти зносилися — шланг не тримається. Муфту міняють."]},"jd8430-11":{"story":"Кондиціонер: компресор жене холодоагент, вентилятор продуває холод крізь фільтри в кабіну.","rules":[["Вентилятор кабіни дме?","так → фільтри й компресор","ні → запобіжники F4/F6 і двигун вентилятора"],["Запобіжники F4 і F6 цілі?","так → двигун вентилятора","ні → запобіжник"]],"probes":[{"tool":"ear","zone":"cab","name":"вентилятор кабіни","ok":"Вентилятор дме.","bad":{"2":"Вентилятор мовчить.","3":"Вентилятор мовчить."}},{"tool":"meter","zone":"cab","name":"запобіжники F4/F6","ok":"Запобіжники цілі.","bad":{"3":"F6 перегорів."}},{"tool":"eye","zone":"cab","name":"фільтр кабіни","ok":"Фільтр чистий.","bad":{"0":"Фільтр кабіни чорний, забитий."}},{"tool":"eye","zone":"cab","name":"рециркуляційний фільтр","ok":"Фільтр чистий.","bad":{"1":"Рециркуляційний фільтр забитий пилом."}},{"tool":"ear","zone":"eng","name":"компресор","ok":"Муфта компресора клацає, компресор гуде рівно.","bad":{"4":"Компресор стукає й не тримає тиск."}}],"why":["Фільтр кабіни забився — повітря мало, холоду мало.","Рециркуляційний фільтр забився — повітря в кабіні не обертається.","Двигун вентилятора згорів — холод є, а дути нікому.","Запобіжник перегорів — вентилятор без живлення.","Компресор не жене холодоагент — холоду немає зовсім."]},"jd8430-12":{"story":"Пічку гріє охолоджувальна рідина двигуна. Її жене водяний насос, а термостат пускає в коло.","rules":[["Рідина доходить до клапана обігрівача?","так → клапан або серцевина","ні → рівень, насос, термостат"]],"probes":[{"tool":"dip","zone":"cool","name":"рівень рідини","ok":"Рівень у нормі.","bad":{"2":"Рівень нижче мінімуму."}},{"tool":"thermo","zone":"cool","name":"шланги обігрівача","ok":"Шланги гарячі на вході.","bad":{"0":"До клапана гаряче, після — холодне.","1":"Обидва шланги теплі, серцевина холодна.","3":"Шланги холодні.","4":"Шланги холодні."}},{"tool":"thermo","zone":"eng","name":"двигун прогрітий?","ok":"Двигун прогрівся до норми.","bad":{"4":"Двигун довго не гріється — термостат відкритий."}},{"tool":"ear","zone":"eng","name":"водяний насос","ok":"Насос працює тихо.","bad":{"3":"Насос вие й підтікає."}}],"why":["Клапан обігрівача не відкривається — гаряча рідина стоїть перед ним.","Серцевина обігрівача забита накипом — рідина не проходить.","Рідини мало — до пічки не доходить. Доливають тієї, що для цієї машини.","Водяний насос не жене рідину — і пічка, і двигун без циркуляції.","Термостат заклинив відкритим — двигун не гріється, і пічці нічого віддати."]},"jd8430-13":{"story":"Кабіна має бути під підпором чистого повітря крізь фільтр. Пил іде, де є щілина або фільтр не тримає.","rules":[["Ущільнювачі й фіксатори дверей у порядку?","так → фільтр кабіни","ні → ущільнювач або регулювання"]],"probes":[{"tool":"eye","zone":"cab","name":"ущільнювачі дверей","ok":"Ущільнювачі цілі.","bad":{"0":"Ущільнювач потріскався, є щілина."}},{"tool":"hand","zone":"cab","name":"фіксатори дверей","ok":"Двері притиснуті щільно.","bad":{"2":"Двері закриті, але не притиснуті — фіксатор збитий."}},{"tool":"eye","zone":"cab","name":"фільтр кабіни","ok":"Фільтр цілий.","bad":{"1":"Фільтр порваний, пил іде крізь нього."}}],"why":["Ущільнювач потріскався — пил тягне у щілину.","Фільтр кабіни порваний — пил іде прямо в кабіну.","Фіксатори не притискають двері — щілина без поломки. Регулюють."]},"jd8430-14":{"story":"Після мийки й дощу вода потрапляє в роз’єми. Глушіння й пуск ідуть через роз’єм шасі X100.","rules":[["У роз’ємі X100 вода чи корозія?","так → чистка й мастило","ні → батарея і стартер"]],"probes":[{"tool":"eye","zone":"cab","name":"роз’єм X100","ok":"Роз’єм сухий.","bad":{"0":"У роз’ємі X100 вода й зелена корозія."}},{"tool":"meter","zone":"eng","name":"напруга батареї","ok":"12,6 В.","bad":{"1":"11,4 В — батарея розряджена."}},{"tool":"ear","zone":"eng","name":"стартер при пуску","ok":"Стартер крутить.","bad":{"2":"Стартер клацає, не крутить, батарея повна."}}],"why":["Вода в роз’ємі X100 замикає контакти — машина не слухає ключа. Чистять, змащують, прокладку — розрізом донизу.","Батарея розряджена — сили на пуск немає.","Стартер клацає, але не крутить — щітки або втягувальне реле."]},"jd8430-15":{"story":"Генератор заряджає батарею, його крутить ремінь допоміжного приводу.","rules":[["Ремінь натягнутий і цілий?","так → генератор або батарея","ні → ремінь"]],"probes":[{"tool":"hand","zone":"eng","name":"ремінь приводу","ok":"Ремінь натягнутий.","bad":{"1":"Ремінь слабкий, блищить, ковзає."}},{"tool":"meter","zone":"eng","name":"напруга на ходу","ok":"14,2 В на ходу.","bad":{"0":"12,3 В на ходу — генератор не заряджає.","2":"14,2 В на ходу, але батарея швидко сідає."}}],"why":["Генератор не дає напруги — лампа горить, батарея сідає.","Ремінь ковзає — генератор крутиться погано.","Батарея не тримає заряд — генератор у нормі."]},"cih2388-01":{"story":"Гідростатика рухає комбайн оливою. Насос підживлення тягне оливу крізь всмоктувальний фільтр, перепуску в ньому немає.","rules":[["Вакуум на всмоктуванні насоса підживлення високий?","так → фільтр","ні → рівень оливи або насос"],["Працювати не довше 30 с — інакше насос загине.","",""]],"probes":[{"tool":"gauge","zone":"hyd","name":"вакуум на всмоктуванні","ok":"Вакуум у нормі.","bad":{"0":"Вакуум високий — фільтр не пропускає."}},{"tool":"dip","zone":"hyd","name":"рівень оливи","ok":"Рівень у нормі.","bad":{"1":"Рівень нижче мінімуму."}},{"tool":"ear","zone":"hyd","name":"насос гідростатики","ok":"Насос гуде рівно.","bad":{"2":"Насос вие, тягне слабко."}}],"why":["Всмоктувальний фільтр без перепуску забився — насос голодує, комбайн стає.","Оливи мало — насос хапає повітря. Доливають гідравлічну ISO 46.","Насос зношений — тягне слабко навіть із чистим фільтром."]},"cih2388-02":{"story":"Жатку тримає циліндр підйому, а оливу в ньому замикає запірна кулька з пружиною.","rules":[["Запірна кулька підйому тримає?","так → циліндр","ні → кулька й пружина"]],"probes":[{"tool":"gauge","zone":"feed","name":"тиск у циліндрі підйому","ok":"Тиск тримається.","bad":{"0":"Тиск падає — кулька не сідає.","1":"Тиск падає."}},{"tool":"eye","zone":"feed","name":"шток циліндра","ok":"Шток сухий.","bad":{"1":"На штоку масляна плівка, ущільнення тече."}}],"why":["Пружина запірної кульки ослабла — кулька не сідає, олива йде назад, жатка опускається.","Ущільнення циліндра тече — олива йде повз поршень."]},"cih2388-03":{"story":"Гідроблок вмикається лише тоді, коли реле тиску оливи двигуна дає дозвіл.","rules":[["Тиск мастила двигуна є, а сигналу реле немає?","так → реле","ні → золотники регулятора"]],"probes":[{"tool":"meter","zone":"eng","name":"реле тиску оливи","ok":"Сигнал реле є.","bad":{"0":"Тиск оливи є, а реле сигналу не дає."}},{"tool":"gauge","zone":"hyd","name":"тиск очікування","ok":"Тиск очікування в нормі.","bad":{"2":"Тиск очікування низький.","1":"Тиск стрибає."}},{"tool":"eye","zone":"hyd","name":"золотник регулятора","ok":"Золотник ходить вільно.","bad":{"1":"Жиклер забитий, золотник заїдає."}}],"why":["Реле тиску оливи не дає дозволу — гідроблок вимкнений, хоч двигун у порядку.","Забитий жиклер — золотник регулятора заїдає.","Золотник компенсатора: тиск очікування низький. Регулюють."]},"cih2388-04":{"story":"Муфта сепаратора — пакет дисків, який стискає олива. Олива ж і охолоджує диски.","rules":[["Олива темна й пахне горілим?","так → пакет дисків","ні → ущільнення, тиск"]],"probes":[{"tool":"dip","zone":"drv","name":"олива приводу","ok":"Олива світла.","bad":{"0":"Олива темна, пахне горілим."}},{"tool":"gauge","zone":"drv","name":"тиск муфти","ok":"Тиск у нормі.","bad":{"1":"Тиск муфти низький, олива чиста.","0":"Тиск у нормі."}}],"why":["Пакет дисків згорів — муфта ковзає. Міняють пакет.","Ущільнення поршня пропускають — диски не дотискаються."]},"cih2388-05":{"story":"Привід сепаратора охолоджує маслоохолоджувач. Якщо ребра забиті — олива гріється.","rules":[["Ребра маслоохолоджувача чисті?","так → муфта","ні → почистити"]],"probes":[{"tool":"eye","zone":"drv","name":"ребра охолоджувача","ok":"Ребра чисті.","bad":{"0":"Ребра забиті пилом і половою."}},{"tool":"dip","zone":"drv","name":"олива приводу","ok":"Олива світла.","bad":{"1":"Олива темна, горіла."}}],"why":["Ребра охолоджувача забиті — олива гріється. Чистять без деталі.","Згорів пакет дисків муфти — ковзання гріє оливу."]},"cih2388-06":{"story":"Ротор крутиться від варіатора: ремінь, рухома половина шківа. Зношені частини дають вібрацію.","rules":[["Штиф імпелера з люфтом?","так → штифт","ні → шків і ремінь"],["Знос рухомої половини шківа більше 0,15 мм?","так → половина шківа","ні → ремінь"]],"probes":[{"tool":"hand","zone":"rotor","name":"штифт імпелера","ok":"Люфту немає.","bad":{"0":"Штифт імпелера люфтить."}},{"tool":"eye","zone":"rotor","name":"рухома половина шківа","ok":"Знос у нормі.","bad":{"1":"Знос 0,3 мм — більше норми 0,15."}},{"tool":"eye","zone":"drv","name":"варіаторний ремінь","ok":"Ремінь цілий.","bad":{"2":"Ремінь потертий, боки скошені."}}],"why":["Штифт імпелера люфтить — ротор б’ється.","Рухома половина шківа зносилася — ремінь ходить, ротор вібрує.","Варіаторний ремінь зношений — ковзає ривками."]},"cih2388-07":{"story":"Реверс похилої камери крутить її назад через обгінну муфту на верхньому валу.","rules":[["Обгінна муфта крутиться в обидва боки?","так → собачки муфти","ні → ремінь"]],"probes":[{"tool":"hand","zone":"feed","name":"обгінна муфта","ok":"Муфта ловить в одну сторону.","bad":{"0":"Муфта крутиться в обидва боки — собачки заїли."}},{"tool":"eye","zone":"feed","name":"ремінь приводу жатки","ok":"Ремінь натягнутий.","bad":{"1":"Ремінь блищить і ковзає."}}],"why":["Собачки обгінної муфти заїли або пружини ослабли — муфта не ловить.","Ремінь приводу жатки ковзає — сили на реверс немає."]},"cih2388-08":{"story":"Привід керованих коліс — гідромотори. Оливу на них ділить дільник потоку, вмикає клапан-селектор.","rules":[["Соленоїд клапана-селектора спрацьовує?","так → дільник потоку і мотори","ні → соленоїд"]],"probes":[{"tool":"meter","zone":"move","name":"соленоїд селектора","ok":"Соленоїд клацає.","bad":{"0":"На соленоїді 12 В, котушка не тягне."}},{"tool":"gauge","zone":"move","name":"тиск на колесах","ok":"Тиск однаковий на обох.","bad":{"1":"Тиск різний на лівому й правому.","2":"Тиск на одному колесі є, мотор не тягне."}},{"tool":"eye","zone":"move","name":"гідромотор колеса","ok":"Гідромотор сухий.","bad":{"2":"З дренажу мотора багато оливи — шайба зношена."}}],"why":["Соленоїд клапана-селектора не тягне — привід не вмикається.","Золотники дільника заїдають — олива йде на одне колесо.","Похила шайба мотора зношена — мотор міняють цілим."]},"cih2388-09":{"story":"Гальма — пакет фрикційних дисків. Вільний зазор пакета має бути 3,75–4,25 мм.","rules":[["Вільний зазор пакета 3,75–4,25 мм?","так → гальма в нормі","ні → міняти всі диски й пластини"]],"probes":[{"tool":"hand","zone":"move","name":"зазор пакета","ok":"Зазор 4,0 мм.","bad":{"0":"Зазор 6,1 мм — диски зношені."}}],"why":["Фрикційні диски зносилися — зазор великий, гальма слабкі. Міняють усі диски й пластини разом."]},"cih2388-10":{"story":"Двигун охолоджують радіатори. Повітря йде крізь обертовий екран, вентилятор крутить ремінь.","rules":[["Екран і радіатор чисті?","так → ремінь, вимикач","ні → почистити"]],"probes":[{"tool":"eye","zone":"eng","name":"обертовий екран","ok":"Екран чистий.","bad":{"0":"Екран забитий половою."}},{"tool":"eye","zone":"eng","name":"радіатор","ok":"Радіатор чистий.","bad":{"1":"Соти радіатора забиті."}},{"tool":"hand","zone":"eng","name":"ремінь вентилятора","ok":"Ремінь натягнутий.","bad":{"2":"Ремінь ковзає."}},{"tool":"thermo","zone":"eng","name":"реальна температура","ok":"Двигун 95 °C — норма.","bad":{"0":"Двигун 107 °C.","1":"Двигун 106 °C.","2":"Двигун 105 °C.","3":"Двигун 92 °C, а лампа горить."}}],"why":["Екран забитий — повітря не йде до радіаторів.","Радіатор забитий — тепло не відходить.","Ремінь ковзає — вентилятор крутиться повільно.","Двигун холодний, а лампа горить — бреше вимикач."]},"cih2388-11":{"story":"Похилу камеру вимикає блок, коли повітря у впуску гаряче: 154 °F — попередження, 163 °F — вимкнення.","rules":[["Повітря у впуску справді гаряче?","так → охолоджувач","ні → датчик"]],"probes":[{"tool":"thermo","zone":"eng","name":"повітря у впуску","ok":"Повітря у впуску 52 °C.","bad":{"0":"Повітря у впуску 74 °C.","1":"Повітря 50 °C, а блок бачить 73 °C."}},{"tool":"eye","zone":"eng","name":"охолоджувач повітря","ok":"Ребра чисті.","bad":{"0":"Ребра охолоджувача забиті."}}],"why":["Охолоджувач наддувного повітря забитий — повітря гаряче. Чистять.","Датчик бреше — повітря в нормі, а блок вимикає камеру."]},"cih2388-12":{"story":"Оберти вентилятора очистки міняє варіатор: мотор із запобіжною муфтою і ремінь.","rules":[["Мотор варіатора крутить, а варіатор стоїть?","так → муфта мотора","ні → ремінь"]],"probes":[{"tool":"ear","zone":"clean","name":"мотор варіатора","ok":"Мотор крутить, варіатор рухається.","bad":{"0":"Мотор гуде, муфта ковзає, варіатор стоїть."}},{"tool":"eye","zone":"clean","name":"ремінь вентилятора","ok":"Ремінь цілий.","bad":{"1":"Ремінь зношений."}}],"why":["Запобіжна муфта мотора ковзає — варіатор не рухається. Міняють мотор.","Ремінь вентилятора зношений — оберти «плавають»."]},"cih2388-13":{"story":"Батарею тримають прижими. Перетягнеш — корпус лопне, недотягнеш — трясе.","rules":[["Корпус батареї цілий?","так → прижими","ні → батарея"]],"probes":[{"tool":"eye","zone":"eng","name":"корпус батареї","ok":"Корпус цілий.","bad":{"0":"Корпус тріснув під прижимом."}},{"tool":"hand","zone":"eng","name":"прижими батареї","ok":"Батарея сидить щільно.","bad":{"1":"Батарея хитається."}}],"why":["Прижими перетягнули — корпус тріснув. Батарею міняють.","Прижими слабкі — батарею трясе. Затягують."]},"cih2388-14":{"story":"У коробці передач ковзна шестерня входить у зачеплення по шліцах. Знос — вибиває передачу.","rules":[["Знос шліців ковзної шестерні по індикатору?","так → шестерня","ні → упорна шайба"]],"probes":[{"tool":"hand","zone":"move","name":"шліци ковзної шестерні","ok":"Люфт у нормі.","bad":{"0":"Люфт шліців більший за норму."}},{"tool":"eye","zone":"move","name":"упорна шайба кришки","ok":"Шайба ціла.","bad":{"1":"Упорна шайба зношена, з борозною."}}],"why":["Шліци ковзної шестерні зносилися — передачу вибиває.","Упорна шайба зношена — вал ходить, передача вмикається з хрускотом."]}}}};
</script>
<script>
/* Майстерня v2 — екран */
(function(){
"use strict";
const D=window.MS_DATA, A=window.ART, M=window.MS, G=M.G;
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app'), KEY='ms_save_v2';
let S=null, tab='yard', cur=null, seenNews=0, lastDoneId=null, toastT=0;
const TI={r:'shims',f:'jug'}, TT={d:'деталь',r:'без деталі',f:'рідина'};
const mname=m=>D.machines[m].brand+' '+D.machines[m].model;
const sil=(m,cls)=>{ const x=D.machines[m], s=A.SIL[x.sil]; return `<svg class="${cls||'sil'}" viewBox="${s.vb}" aria-hidden="true">${s.draw(x.color,x.color2)}</svg>`; };
const ic=k=>A.svg(k||'spin');
const g=n=>M.fmt(n)+' ₴';
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function toast(t,k){ if(!t) return; let el=$('.toast'); if(!el){ el=document.createElement('div'); document.body.appendChild(el); } el.className='toast '+(k||''); el.innerHTML=t; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),3600); }
function after(r){ if(r&&r.t) toast(esc(r.t),r.ok===false?'bad':'');
  const fresh=S.news.slice(seenNews); seenNews=S.news.length;
  save(); render();
  if(S.lastDone&&S.lastDone.id!==lastDoneId){ lastDoneId=S.lastDone.id; return doneCard(S.lastDone,fresh); }
  if(fresh.length&&(r===undefined||r.ff)) newsSheet(fresh); else if(fresh.length) toast(fresh.map(n=>esc(n.x)).join('<br>'),fresh.some(n=>n.k==='bad')?'bad':'ok'); }

/* ---------- старт ---------- */
function start(){ const sv=load();
  app.innerHTML=`<div class="scroll"><div class="wrap">
   <div class="hero"><div class="k">Поле зору · гра</div><h1>Майстерня</h1>
    <div>Машини приїжджають зі скаргою. Оглядай, звіряйся з книгою, назви причину — механіки полагодять. Кожен огляд забирає час у всіх відліків одразу.</div>
    <div class="pair">${sil('jd8430')}${sil('cih2388')}</div>
    <div style="font-size:12.5px;color:#CFE0E5">John Deere 8430 · Case IH 2388 — справжні моделі, форми й кольори наші.</div></div>
   <div class="card"><b style="color:var(--main)">Як грати</b><div style="font-size:14px">
    1. <b>Двір</b>: бери машину або відмов. У кожної — відлік до здачі.<br>
    2. <b>Розслідування</b>: тисни точки на машині — манометр, щуп, мультиметр, слух. Покази звіряй із книгою.<br>
    3. <b>Підозрювані</b>: тисни того, кого міняти. Влучив — механік ремонтує. Помилився — час і робота пропали.<br>
    4. <b>Деталь</b>: є на полиці — ставиш. Немає — купуєш або замовляєш; як привезуть, ремонт почнеться сам.<br>
    5. Нема що робити — <b>⏩ Далі</b>: годинник перескочить до найближчої події.<br>
    6. Партія — ${G.machines} машин. На перших двох книга сама відкидає те, що огляди виключають.</div></div>
   <div class="card"><div class="leg"><b>★</b><span>оригінал</span><b>●</b><span>добротний аналог</span><b>○</b><span>дешевий аналог</span><b>◆</b><span>вигадана марка — таких фірм немає</span><b>₴</b><span>ціни ігрові</span></div></div>
   <div class="btns"><button class="main" id="bNew">Почати</button>${sv&&!sv.over&&sv.v===2?'<button id="bCont">Продовжити · '+M.clock(sv.t)+'</button>':''}</div>
   <div class="foot">Поломки, правила й номери сторінок — з книг ремонту й діагностики. Номери деталей — наші (місце У… і ПЗ-…).</div>
  </div></div>`;
  $('#bNew').onclick=()=>{ S=M.newGame(D,(Date.now()%100000)+1); seenNews=S.news.length; tab='yard'; cur=null; save(); render(); };
  const c=$('#bCont'); if(c) c.onclick=()=>{ S=sv; seenNews=S.news.length; lastDoneId=S.lastDone&&S.lastDone.id; tab='yard'; render(); };
}

/* ---------- каркас ---------- */
function timers(){ const out=[];
  for(const j of S.jobs){ const left=j.dl-S.t;
    if(j.work&&j.work.on) out.push({j:j.id,c:'rep',n:D.machines[j.m].model+' · ремонт',v:j.work.end-S.t,max:j.work.h});
    else out.push({j:j.id,c:left<=2?'low':'',n:D.machines[j.m].model+(j.wait?' · чекає деталь':j.work?' · черга на пост':' · здати за'),v:left,max:Math.max(left,j.dl-j.arr),late:left<0}); }
  for(const o of S.orders) out.push({c:'del',n:'Їде: '+o.name,v:o.at-S.t,max:o.at-S.t+0.01});
  for(const j of S.yard) out.push({j:j.id,y:1,c:'yd',n:'У дворі: '+D.machines[j.m].model,v:j.exp-S.t,max:G.offer_life});
  return out; }
function render(){ if(!S) return start(); if(S.over) return final();
  const ne=M.nextEvent(D,S);
  const tm=timers();
  app.innerHTML=`<div class="top"><div class="grow"><div class="t1">Майстерня · ${M.clock(S.t)}</div><div class="t2">машин ${S.arrived} з ${G.machines} · репутація ${S.rep>0?'+':''}${S.rep}</div></div>
    <div class="cash ${S.cash<0?'neg':''}">${g(S.cash)}<small>${M.shopDebt(S)?'борг магазину '+M.fmt(M.shopDebt(S)):'каса'}</small></div></div>
   <div class="tms">${tm.length?tm.map(t=>`<button class="tmr ${t.c}" ${t.j?`data-j="${t.j}"`:''} ${t.y?'data-y="1"':''}><span>${esc(t.n)}</span><b>${t.late?'запізнення '+M.hh(-t.v):M.hh(t.v)}</b><i><u style="width:${Math.max(0,Math.min(100,t.v/t.max*100))}%"></u></i></button>`).join(''):'<div class="tmr idle"><span>Поки тихо</span><b>—</b></div>'}</div>
   <div class="scroll" id="sc"><div class="wrap" id="main"></div></div>
   <button class="ffb" id="ff">⏩ Далі${ne?': '+esc(ne[1])+' · через '+M.hh(ne[0]-S.t):''}</button>
   <nav class="tabs">${[['yard','⌂','Двір',S.yard.length],['stock','▦','Склад',0],['shop','⛟','Магазини',0],['cash','₴','Каса',0],['book','✎','Зошит',0]].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]||(tab==='job'&&t[0]==='yard')?'on':''}"><b>${t[1]}</b>${t[2]}${t[3]?`<span class="bd">${t[3]}</span>`:''}</button>`).join('')}</nav>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; cur=null; render(); });
  app.querySelectorAll('.tmr[data-j]').forEach(b=>b.onclick=()=>{ if(b.dataset.y){ tab='yard'; cur=null; } else { tab='job'; cur=+b.dataset.j; } render(); });
  $('#ff').onclick=()=>{ const r=M.ff(D,S); after({ff:true,ok:r.ok,t:r.ok?'':r.t}); };
  const mn=$('#main');
  if(tab==='job'&&!S.jobs.find(j=>j.id===cur)){ tab='yard'; cur=null; }
  ({yard:vYard,job:vJob,stock:vStock,shop:vShop,cash:vCash,book:vBook})[tab](mn);
}

/* ---------- двір ---------- */
function head(j){ const F=M.fault(D,j), left=j.dl-S.t;
  return `<div class="mh">${sil(j.m)}<div class="grow"><b class="nm">${esc(mname(j.m))}</b><div class="s">${esc(F.sys)} · №${j.id}</div></div></div>
   <div class="cmp">«${esc(F.sym)}»</div>
   <div class="chips"><span class="chip ${left<=2?'r':''}">${left<0?'запізнення '+M.hh(-left):'здати за '+M.hh(left)}</span><span class="chip o">оплата ${g(j.fee)}</span>${j.only?'<span class="chip g">★ тільки оригінал</span>':''}</div>`; }
function status(j){ if(j.work&&j.work.on) return 'механік ремонтує · ще '+M.hh(j.work.end-S.t); if(j.work) return 'у черзі на пост';
  if(j.wait) return 'чекаємо деталь'; const n=Object.keys(j.probes).length; return n?'оглядів: '+n:'ще не дивились'; }
function vYard(el){
  let h=`<h2 class="sec">Двір</h2>`;
  if(!S.yard.length) h+=`<div class="empty">Нових машин зараз немає. ${S.arrived<G.machines?'Ще приїдуть.':''}</div>`;
  for(const j of S.yard) h+=`<div class="card">${head(j)}<div class="s">Чекає ще ${M.hh(j.exp-S.t)}, потім поїде.</div><div class="btns"><button class="main" data-a="${j.id}">Взяти</button><button data-r="${j.id}">Відмовити</button></div></div>`;
  h+=`<h2 class="sec">У роботі · ${S.jobs.length} з ${G.backlog} · постів ${G.posts}</h2>`;
  if(!S.jobs.length) h+=`<div class="empty">Поки порожньо.</div>`;
  for(const j of S.jobs) h+=`<button class="card jc" data-o="${j.id}">${head(j)}<div class="s">${status(j)}</div></button>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ const r=M.accept(D,S,+b.dataset.a); if(r.ok){ tab='job'; cur=+b.dataset.a; } after(r); });
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>after(M.refuse(D,S,+b.dataset.r)));
  el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ tab='job'; cur=+b.dataset.o; render(); });
}

/* ---------- розслідування ---------- */
function vJob(el){ const j=S.jobs.find(x=>x.id===cur), Mc=D.machines[j.m], F=M.fault(D,j), Q=M.quest(D,j), sl=A.SIL[Mc.sil];
  const hint=j.id<=G.hint_jobs, pos=M.possible(D,j);
  const used={}; const pts=Q.probes.map((p,i)=>{ const z=sl.zones[p.zone]||[180,110]; const k=p.zone; used[k]=(used[k]||0)+1; const n=used[k]-1;
    return {i:i,p:p,x:z[0]+(n%2?1:-1)*Math.ceil(n/2)*30,y:z[1]+(n>2?24:0)}; });
  let h=`<div class="btns" style="justify-content:flex-start"><button class="bt sm" id="bBack">← Двір</button></div>
   <div class="card hot">${head(j)}<div class="story">${esc(Q.story)}</div></div>`;
  if(j.work||j.wait){ const c=F.causes[(j.work||j.wait).i];
    h+=`<div class="card"><b style="color:var(--main)">${j.work&&j.work.on?'Механік ремонтує':j.work?'Черга на пост':'Чекаємо деталь'}</b><div>${esc(c.fix)}</div>
     ${j.work&&j.work.on?`<div class="prog"><i style="width:${Math.max(4,100*(S.t-j.work.start)/j.work.h)}%"></i></div><div class="s">готово через ${M.hh(j.work.end-S.t)} — тисни «Далі» або займись іншою машиною</div>`:''}
     ${j.wait?`<div class="s">Як привезуть — ремонт почнеться сам.</div>`:''}</div>`; }
  h+=`<div class="stage"><svg viewBox="${sl.vb}">${sl.draw(Mc.color,Mc.color2)}${pts.map(q=>{ const done=j.probes[q.i], r=done?M.reading(D,j,q.i):null; const T=D.quest.tools[q.p.tool];
     return `<g class="pt ${done?(r.bad?'bad':'seen'):''}" data-p="${q.i}"><circle class="r" cx="${q.x}" cy="${q.y}" r="14"/><text x="${q.x}" y="${q.y+5}" text-anchor="middle">${done?(r.bad?'!':'✓'):T[0]}</text></g>`; }).join('')}</svg></div>
   <div class="probes">${Q.probes.map((p,i)=>{ const T=D.quest.tools[p.tool], done=j.probes[i], r=done?M.reading(D,j,i):null;
     return `<button class="pr ${done?(r.bad?'bad':'seen'):''}" data-p="${i}" ${j.work?'disabled':''}><span class="tg">${T[0]}</span><span><b>${esc(p.name)}</b><small>${done?esc(r.t):esc(T[1])+' · '+M.hh(T[2])}</small></span></button>`; }).join('')}</div>
   <div class="card"><h3 class="kk">Книга · ${esc(F.ref)}</h3><div class="rules">${Q.rules.filter(r=>r[0]).map((r,k)=>`<div class="rq">${k+1}. ${esc(r[0])}</div>${r[1]||r[2]?`<div class="br">${r[1]?`<div class="b">${esc(r[1])}</div>`:''}${r[2]?`<div class="b">${esc(r[2])}</div>`:''}</div>`:''}`).join('')}</div>
     <div class="s">Книга радить: ${esc(F.check)}</div></div>
   <div class="card"><h3 class="kk">Підозрювані${hint?' · на перших машинах книга сама відкидає зайве':''}</h3><div class="sus">${F.causes.map((c,i)=>{ const pt=c.t==='d'?Mc.parts[c.part]:null;
     const out=j.tried[i]||(hint&&!pos.includes(i)); const only=hint&&pos.length===1&&pos[0]===i;

   ${S.shop.firm.debt.map(d=>`<div class="s">Відстрочка ${g(d.amt)} — віддати за ${M.hh(d.due-S.t)}</div>`).join('')}
   <div class="btns"><button id="pay" ${M.shopDebt(S)?'':'disabled'}>Віддати борг магазину</button></div></div>
   <div class="card"><div class="rows"><span>Репутація</span><b>${S.rep>0?'+':''}${S.rep}</b><span>Здано</span><b>${st.done}</b><span>Запізнень</span><b>${st.late}</b><span>Забрали</span><b>${st.lost}</b><span>Повернулись</span><b>${st.back}</b><span>Оглядів</span><b>${st.probes}</b><span>Ремонтів «не те»</span><b>${st.wrong}</b><span>Відсотки й пені</span><b>${g(st.interest)}</b></div></div>
   <h2 class="sec">Журнал</h2>${S.log.slice(-14).reverse().map(n=>`<div class="nw ${n.k}">${M.clock(n.t)} · ${esc(n.x)}</div>`).join('')}`;
  $('#pay').onclick=()=>after(M.payShop(D,S)); }
function vBook(el){ el.innerHTML=`<h2 class="sec">Зошит майстра · ${S.book.length}</h2><div class="sub">Картка з’являється після кожної правильно знайденої поломки.</div>`+(S.book.length?S.book.slice().reverse().map(b=>card(b.f,b.m,b.i)).join(''):'<div class="empty">Поки порожньо.</div>'); }
function final(){ const r=M.result(D,S), st=S.stats;
  app.innerHTML=`<div class="scroll"><div class="wrap"><div class="hero"><div class="k">${M.clock(S.t)}</div><h1>Підсумок</h1><div class="stars">${[1,2,3].map(i=>i<=r.stars?'★':'<span class="o">★</span>').join('')}</div></div>
   <div class="card"><div class="rows"><span>Почали з</span><b>${g(G.start)}</b><span>Чистий підсумок</span><b>${g(r.net)}</b><span>Прибуток</span><b>${g(r.profit)}</b><span>Репутація</span><b>${S.rep>0?'+':''}${S.rep}</b><span>Здано</span><b>${st.done}</b><span>Запізнень</span><b>${st.late}</b><span>Забрали</span><b>${st.lost}</b><span>Повернулись</span><b>${st.back}</b><span>Оглядів</span><b>${st.probes}</b></div>
   <div class="s">★ — у плюсі · ★★ — прибуток від 20 000 · ★★★ — від 35 000, репутація від +5 і жодної забраної машини.</div></div>
   <h2 class="sec">Зошит майстра · ${S.book.length}</h2>${S.book.map(b=>card(b.f,b.m,b.i)).join('')}
   <div class="btns"><button class="main" id="again">Ще партія</button></div></div></div>`;
  $('#again').onclick=()=>{ S=M.newGame(D,(Date.now()%100000)+1); seenNews=S.news.length; lastDoneId=null; tab='yard'; save(); render(); }; }

window.MS_UI={get S(){return S;},render,D};
start();
})();

</script>

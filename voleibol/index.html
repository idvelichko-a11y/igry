<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Агроволейбол</title>
<meta name="description" content="Волейбол на двох: кукурудза, пшениця й соняшник. Грай з другом із двох телефонів або проти комп'ютера.">
<meta name="theme-color" content="#1F4E5F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#F2F4F4; --card:#FFFFFF; --fg:#2C3E50; --mute:#66767F; --line:#D5DCDE;
  --main:#1F4E5F; --accent:#C9A961; --on-main:#FFFFFF; --on-accent:#1B2A30;
  --ov:rgba(14,26,31,.86); --ov-fg:#FFFFFF; --ov-mute:#C6D3D8; --star:#E3C77F;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Unbounded","Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10181B; --card:#18232A; --fg:#E6ECEE; --mute:#93A3AA; --line:#2A3940;
  --main:#86BACB; --accent:#D9BD7E; --on-main:#10181B; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  overscroll-behavior:none}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(1.1rem,3.4vw,1.7rem);line-height:1.2;margin:2px 0 0;color:var(--main)}
.stage{position:relative;background:#7FB6D6;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (max-width:620px){.stage{aspect-ratio:1/1.18}}
@media (orientation:landscape) and (max-height:520px){
  body{padding-top:6px;padding-bottom:10px}
  .wrap>header{display:none}
  .stage{aspect-ratio:auto;height:calc(100vh - 86px);height:calc(100dvh - 86px);min-height:200px}
  .pad button{min-height:48px}
}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;background:rgba(10,20,24,.35)}
.card{background:var(--ov);color:var(--ov-fg);border-radius:14px;padding:12px 14px;max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:center}
.card h3{font-family:var(--f-head);font-weight:700;font-size:clamp(.95rem,3.4vw,1.3rem);line-height:1.25;margin:0}
.card p{margin:0;font-size:.88rem;color:var(--ov-mute)}
.card .k{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--star)}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chars button{font:inherit;color:var(--ov-fg);background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.chars button.on{border-color:var(--star);background:rgba(227,199,127,.16)}
.chars canvas{width:54px;height:66px}
.chars b{font-size:.86rem}
.stats{display:grid;grid-template-columns:auto 1fr;gap:1px 6px;font-size:.66rem;width:100%;padding:0 4px;text-align:left;color:var(--ov-mute)}
.stats i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.16);align-self:center;position:relative;overflow:hidden}
.stats i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--star)}
.cdesc{font-size:.82rem!important;min-height:2.4em}
.cdesc b{color:var(--star)}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.btns button{font:inherit;font-weight:800;font-size:.95rem;padding:10px 18px;border-radius:999px;border:0;background:var(--star);color:#1B2A30;cursor:pointer}
.btns button.sec{background:transparent;color:var(--ov-fg);border:1px solid rgba(255,255,255,.5)}
.btns button:disabled{opacity:.5}
.link{font-size:.82rem;background:rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;word-break:break-all;user-select:all;-webkit-user-select:all;color:#fff}
.code{font-family:var(--f-head);font-size:1.5rem;letter-spacing:.2em;color:var(--star)}
.pad{display:grid;grid-template-columns:1fr 1fr .25fr 1.5fr;gap:8px}
.pad button{font:inherit;font-weight:800;font-size:1.25rem;min-height:64px;border-radius:12px;border:2px solid var(--main);background:var(--card);color:var(--main);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad button.on{background:var(--main);color:var(--on-main)}
.pad button#bJ{border-color:var(--accent);color:var(--fg);font-size:1.05rem}
.pad button#bJ.on{background:var(--accent);color:var(--on-accent)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 button{font:inherit;font-size:.84rem;font-weight:700;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.row2 .hint{font-size:.8rem;color:var(--mute);flex:1 1 200px;min-width:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#bExit{position:absolute;left:8px;bottom:8px;font:inherit;font-weight:800;font-size:.8rem;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(14,26,31,.6);color:#fff;cursor:pointer;z-index:3}
body.big{overflow:hidden}
body.big .wrap{position:fixed;inset:0;max-width:none;margin:0;z-index:50;background:var(--bg);gap:6px;
  padding:env(safe-area-inset-top,0px) max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
body.big .wrap>header, body.big .row2{display:none}
body.big .stage{flex:1 1 auto;aspect-ratio:auto;min-height:0;height:auto;border-radius:10px}
body.big .pad button{min-height:54px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Поле зору · гра на двох</p>
    <h1>Агроволейбол</h1>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Волейбольний майданчик у полі"></canvas>
    <button id="bExit" hidden>✕ Згорнути</button>
    <div class="ov" id="ov"><div class="card" id="card"></div></div>
  </div>
  <div class="pad">
    <button id="bL" aria-label="Ліворуч">◀</button>
    <button id="bR" aria-label="Праворуч">▶</button>
    <span></span>
    <button id="bJ" aria-label="Стрибок">▲ Стрибок</button>
  </div>
  <div class="row2">
    <button id="bBig">⛶ На весь екран</button>
    <button id="bSnd" aria-pressed="true">Звук: увімк.</button>
    <button id="bMenu">У меню</button>
    <span class="hint">На комп'ютері: ← → і ↑ (або A D і W). Гра до 11 очок: м'яч упав на твоєму боці — очко суперника.</span>
  </div>
</div>
<script src="../lib/peerjs.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id), TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('c'); let ctx=cv.getContext('2d');
let BOTE=8; const RB=3.2, NH=12, NR=.7, GB=55, GP=115, VB=43, WIN=11, HOME=[25,75];
const CH=[
 {id:'corn', n:'Кукурудза', H:16, rh:3, rs:3, sp:20, jv:40, pw:1.12, fw:.25, cannon:1, st:[5,2,3,5], sk:'Гарматний удар', d:'Висока й б\'є найсильніше. У стрибку удар ще потужніший. Повільна.'},
 {id:'wheat', n:'Пшениця', H:10, rh:3.2, rs:1.6, sp:35, jv:48, pw:1, fw:.3, dbl:1, st:[2,5,5,2], sk:'Подвійний стрибок', d:'Найшвидша і вміє стрибнути ще раз у повітрі. Маленька, удар слабший.'},
 {id:'sun', n:'Соняшник', H:12.5, rh:4.8, rs:1.4, sp:27, jv:36, pw:1, fw:.45, st:[3,3,2,3], sk:'Точний удар', d:'Широкою головою легко дістає м\'яч і завжди посилає його дугою на бік суперника. Стрибає низько.'},
];
const STN=['Зріст','Швидкість','Стрибок','Удар'];

/* ---------- стан ---------- */
const G={mode:'menu',kind:'bot',me:0,flip:false,P:[null,null],ball:{x:25,y:20,vx:0,vy:0,rot:0},bd:{x:25,y:20},score:[0,0],phase:'serve',pT:0,server:0,touch:0,lastSide:-1,
  owner:0,epoch:0,decl:false,t:0,serveY:20,banner:'',bT:0,rp:null,rtt:0,again:[false,false],over:false,puffs:[],paused:false};
let myCh=0; try{const v=+localStorage.getItem('pz_vol_ch'); if(v>=0&&v<3) myCh=v;}catch(e){}
const key={}, tin={l:false,r:false}, jq=[false,false];
function mkP(side,ch){return {side:side,ch:ch,x:HOME[side],y:0,vx:0,vy:0,gr:true,jn:0,cd:0,sq:0};}
G.P=[mkP(0,0),mkP(1,2)];

/* ---------- фізика ---------- */
function updP(p,dt,dir,jp){ const c=CH[p.ch]; p.vx+=(dir*c.sp-p.vx)*Math.min(1,dt*16);
  if(jp){ if(p.gr){p.vy=c.jv;p.gr=false;p.jn=1;beep(300,0,.08,'sine',.07);} else if(c.dbl&&p.jn<2){p.vy=c.jv*.85;p.jn=2;G.puffs.push({x:p.x,y:p.y,t:0});beep(420,0,.08,'sine',.07);} }
  p.vy-=GP*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.y<=0){ if(!p.gr&&p.vy<-25)p.sq=.16; p.y=0;p.vy=0;p.gr=true;p.jn=0; }
  const w=Math.max(c.rh,c.rs); p.x=clamp(p.x,p.side?50+NR+w:w,p.side?100-w:50-NR-w); if(p.cd>0)p.cd-=dt; if(p.sq>0)p.sq-=dt; }
function ballFree(b,dt){ b.vy-=GB*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vx*dt*.22;
  if(b.x<RB){b.x=RB;b.vx=Math.abs(b.vx)*.85;} if(b.x>100-RB){b.x=100-RB;b.vx=-Math.abs(b.vx)*.85;}
  const cy=clamp(b.y,0,NH), dx=b.x-50, dy=b.y-cy, d=Math.hypot(dx,dy), R=RB+NR;
  if(d<R){ let nx,ny; if(d>1e-4){nx=dx/d;ny=dy/d;} else {nx=b.vx>0?-1:1;ny=0;} b.x=50+nx*R; b.y=cy+ny*R; const vn=b.vx*nx+b.vy*ny; if(vn<0){b.vx-=1.7*vn*nx;b.vy-=1.7*vn*ny;} return true; }
  return false; }
function hitP(b,p){ const c=CH[p.ch], cx=p.x; let cy=p.y+c.H-c.rh, r=c.rh, dx=b.x-cx, dy=b.y-cy, d=Math.hypot(dx,dy);
  if(d>=RB+r){ cy=clamp(b.y,p.y+c.rs,Math.max(p.y+c.rs,p.y+c.H-c.rh)); r=c.rs; dx=b.x-cx; dy=b.y-cy; d=Math.hypot(dx,dy); if(d>=RB+r) return false; }
  let nx=d>1e-4?dx/d:0, ny=d>1e-4?dy/d:1; b.x=cx+nx*(RB+r+.02); b.y=cy+ny*(RB+r+.02);
  if(p.cd>0) return false;
  { const f=c.fw, s=p.side?-1:1; nx+=s*f; ny+=f*.5; const l=Math.hypot(nx,ny)||1; nx/=l; ny/=l; }
  const sp=VB*c.pw*((c.cannon&&!p.gr)?1.2:1); b.vx=nx*sp+p.vx*.25; b.vy=ny*sp+Math.max(0,p.vy)*.2; p.cd=.2; return true; }
function isOver(){const a=G.score[0],b=G.score[1]; return (a>=WIN||b>=WIN)&&(Math.abs(a-b)>=2||a>=15||b>=15);}
function say(s,t){G.banner=s;G.bT=t||1.4;}
function who(side){ if(G.kind==='local') return side===0?'Лівий':'Правий'; return side===G.me?'Ти':(G.kind==='bot'?'Комп\'ютер':'Суперник'); }
function point(w,why){ if(G.log) G.log.push([w,why,Math.round(G.ball.x),G.lastSide,G.touch]); G.score[w]++; G.phase='point'; G.pT=1.5; G.server=w; G.over=isOver(); G.decl=true;
  if(G.kind==='net'){ G.epoch++; send({t:'pt',e:G.epoch,sc:G.score,w:w,why:why}); }
  pointFx(w,why); }
function pointFx(w,why){ const mine=G.kind!=='local'&&w===G.me; say(G.kind==='local'?'Очко: '+who(w).toLowerCase():mine?'Очко тобі!':'Очко суперника',1.4);
  beep(880,0,.12,'square',.07); beep(mine||G.kind==='local'?1175:660,.13,.2,'square',.07); }
function startServe(side){ G.phase='serve'; G.srvT=0; G.server=side; G.owner=side; G.touch=0; G.lastSide=-1; G.decl=false;
  const b=G.ball; b.x=HOME[side]; G.serveY=CH[G.P[side].ch].H+6.5; b.y=G.serveY; b.vx=b.vy=0;
  for(const p of G.P) if(isLocal(p.side)){p.x=HOME[p.side];p.y=0;p.vx=p.vy=0;p.gr=true;p.jn=0;}
  say('Подає: '+who(side).toLowerCase(),1.1); }
function isLocal(side){ return G.kind==='local'||G.kind==='bot'||side===G.me; }
function ballAuth(dt,cols){ const b=G.ball;
  if(G.phase==='serve'){ b.vx=b.vy=0; b.y=G.serveY+Math.sin(G.t*4)*.4; G.srvT+=dt; if(G.srvT>7){ G.phase='rally'; G.lastSide=-1; } }
  else if(ballFree(b,dt)) tick(170,.04);
  for(const p of cols){ if(hitP(b,p)){ beep(190+CH[p.ch].pw*90,0,.09,'triangle',.16);
      if(G.phase==='serve') G.phase='rally';
      if(G.phase==='rally'){ if(G.lastSide===p.side) G.touch++; else {G.lastSide=p.side;G.touch=1;} } } }
  const s=Math.hypot(b.vx,b.vy); if(s>82){b.vx*=82/s;b.vy*=82/s;}
  if(b.y<=RB){ b.y=RB; if(G.phase==='rally'){ tick(90,.12); point(b.x<50?1:0,'land'); b.vy=Math.abs(b.vy)*.5; b.vx*=.7; return; } b.vy=Math.abs(b.vy)*.55; b.vx*=.8; } }
let tickCd=0; function tick(f,v){ if(tickCd>0)return; tickCd=.08; beep(f,0,.06,'sine',v); }

/* ---------- комп'ютер ---------- */
function botStep(p,dt){ const bot=p.bot||(p.bot={t:0,tx:HOME[p.side],st:0,err:0}); const b=G.ball, c=CH[p.ch], s=p.side?1:-1; bot.t-=dt; let jump=false;
  if(bot.t<=0){ bot.t=.2; bot.err=(Math.random()-.5)*BOTE+(Math.random()<.1?(Math.random()-.5)*16:0);
    if(G.phase==='serve'&&G.server===p.side){ bot.st+=.1; bot.tx=b.x+s*1.5; }
    else { bot.st=0; const f={x:b.x,y:b.y,vx:b.vx,vy:b.vy,rot:0}; let land=null; const hy=c.H+RB*.5;
      if(G.phase==='rally') for(let i=0;i<150;i++){ ballFree(f,.02); if(f.y<=hy&&f.vy<0){land=f.x;break;} }
      if(land!==null&&((land>50)===(p.side===1))) { const dn=Math.abs(land-50), th=dn<10?.05:dn<25?.3:.5; bot.tx=land+s*(RB+c.rh)*Math.sin(th)+bot.err; } else bot.tx=HOME[p.side]+s*3; } }
  const dx=bot.tx-p.x, dir=Math.abs(dx)<.7?0:Math.sign(dx);
  if(G.phase==='serve'&&G.server===p.side){ if(bot.st>.9&&Math.abs(dx)<1) jump=true; }
  else if(G.phase==='rally'&&((b.x>50)===(p.side===1))){ const top=p.y+c.H, gap=b.y-RB-top; if(Math.abs(b.x-p.x)<5.5&&b.vy<0&&gap>1.5&&gap<c.jv*c.jv/(2*GP)*.9&&Math.random()<.5) jump=true; }
  updP(p,dt,dir,jump&&(p.gr||(c.dbl&&p.jn<2&&p.vy<0&&Math.random()<.2))); }

/* ---------- крок гри ---------- */
function dirOf(side){ if(G.kind==='local') return side===0?((key.d?1:0)-(key.a?1:0)):((key.right?1:0)-(key.left?1:0));
  const d=((key.right||key.d||tin.r)?1:0)-((key.left||key.a||tin.l)?1:0); return G.flip?-d:d; }
function step(dt){ G.t+=dt; if(tickCd>0)tickCd-=dt;
  for(const p of G.P){ if((G.kind==='bot'&&p.side!==G.me)||(G.auto&&isLocal(p.side))) botStep(p,dt); else if(isLocal(p.side)){ const j=jq[G.kind==='local'?p.side:0]; updP(p,dt,dirOf(p.side),j); } }
  jq[0]=jq[1]=false;
  if(G.kind==='net'){ const o=G.P[1-G.me], r=G.rp; if(r){ r.age+=dt; const a=Math.min(r.age,.12), k=Math.min(1,dt*22); o.x+=(r.x+r.vx*a-o.x)*k; o.y+=(Math.max(0,r.y+r.vy*a)-o.y)*k; o.vx=r.vx; o.vy=r.vy; o.gr=r.y<=.01; }
    if(G.owner===G.me){ ballAuth(dt,[G.P[G.me]]); const b=G.ball;
      if(G.phase==='rally'&&((b.x<50?0:1)!==G.me)&&Math.abs(b.x-50)>1){ G.epoch++; G.owner=1-G.me; send({t:'ho',e:G.epoch,b:pk(b)}); } }
    else { const b=G.ball; if(G.phase!=='serve'){ ballFree(b,dt); if(b.y<=RB){b.y=RB;b.vy=Math.abs(b.vy)*.5;b.vx*=.8;} } } }
  else ballAuth(dt,G.P);
  const k=G.kind==='net'&&G.owner!==G.me?Math.min(1,dt*16):1; G.bd.x+=(G.ball.x-G.bd.x)*k; G.bd.y+=(G.ball.y-G.bd.y)*k;
  if(G.phase==='point'){ G.pT-=dt; if(G.pT<=0){ if(G.over){ endMatch(); } else if(G.kind!=='net'){ startServe(G.server); } else if(G.decl){ G.epoch++; send({t:'sv',e:G.epoch,srv:G.server}); startServe(G.server); } } }
  for(const f of G.puffs) f.t+=dt; if(G.puffs.length&&G.puffs[0].t>.4) G.puffs.shift();
  if(G.bT>0) G.bT-=dt; }
function startMatch(kind,me,chs){ G.kind=kind; G.me=me; G.flip=(kind!=='local'&&me===1); G.P=[mkP(0,chs[0]),mkP(1,chs[1])]; G.score=[0,0]; G.over=false; G.again=[false,false]; G.epoch=1; G.rp=null; G.puffs=[];
  G.mode='play'; G.paused=false; startServe(0); G.bd.x=G.ball.x; G.bd.y=G.ball.y; ui(); }
function endMatch(){ G.mode='over'; const w=G.score[0]>G.score[1]?0:1; if(G.kind==='local'||w===G.me) [523,659,784,1047].forEach((f,i)=>beep(f,i*.14,.2,'triangle',.14)); else beep(160,0,.5,'sawtooth',.08); ui(); }

/* ---------- мережа ---------- */
const PFX='pz-agrovol-'; let peer=null, conn=null, code='', lag=0, pingT=0, sendT=0, joinTO=null, netState='';
const Q=new URLSearchParams(location.search), isLoc=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
if(isLoc&&Q.get('lag')) lag=+Q.get('lag')||0;
function peerOpts(){ const s=Q.get('srv'); if(s&&isLoc){const a=s.split(':'); return {host:a[0],port:+a[1],path:'/',secure:false,debug:1};} return {debug:1}; }
function mkCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)]; return s;}
function pk(b){return [Math.round(b.x*100)/100,Math.round(b.y*100)/100,Math.round(b.vx*100)/100,Math.round(b.vy*100)/100];}
function send(m){ if(conn&&conn.open){ try{conn.send(m);}catch(e){} } }

  if(play) return;
  if(G.mode==='menu'){
    card.innerHTML='<span class="k">Поле зору · волейбол на двох</span><h3>'+(invite?'Тебе кличуть на матч':'Обери гравця')+'</h3>'+charPicker()+'<div class="btns">'+
      (invite?'<button id="mJoin">Приєднатися до гри</button><button class="sec" id="mBot">Проти комп\'ютера</button>'
             :'<button id="mHost">Грати удвох онлайн</button><button class="sec" id="mBot">Проти комп\'ютера</button>'+(coarse?'':'<button class="sec" id="mLoc">Удвох на одній клавіатурі</button>'))+'</div>';
    paintPortraits();
    const h=$('mHost'), j=$('mJoin'), l=$('mLoc');
    if(h) h.onclick=()=>{audioInit(); hostGame();}; if(j) j.onclick=()=>{audioInit(); joinGame(invite);};
    $('mBot').onclick=()=>{audioInit(); let o=Math.floor(Math.random()*3); startMatch('bot',0,[myCh,o]);};
    if(l) l.onclick=()=>{audioInit(); startMatch('local',0,[myCh,(myCh+1+Math.floor(Math.random()*2))%3]);};
  } else if(G.mode==='lobby'){
    const url=location.origin+location.pathname+'?g='+code, back='<button class="sec" id="lBack">Назад</button>';
    if(netState==='err') card.innerHTML='<h3>Не вийшло</h3><p>'+G.netMsg+'</p><div class="btns"><button id="lBack">Назад</button></div>';
    else if(netState==='join') card.innerHTML='<span class="k">Гра '+code+'</span><h3>Заходимо в гру…</h3><p>З\'єднуємо два телефони напряму. Це займає кілька секунд.</p><div class="btns">'+back+'</div>';
    else if(netState==='open') card.innerHTML='<h3>Створюємо гру…</h3><p>Зв\'язуємось із сервером знайомства.</p><div class="btns">'+back+'</div>';
    else { card.innerHTML='<span class="k">Гру створено · ти граєш за: '+CH[myCh].n+'</span><h3>Надішли посилання супернику</h3><div class="link" id="lUrl">'+url+'</div><p>Коли він відкриє посилання й натисне «Приєднатися», матч почнеться сам. Не закривай цю сторінку.</p><div class="btns">'+
        (navigator.share?'<button id="lShare">Поділитися</button>':'')+'<button '+(navigator.share?'class="sec" ':'')+'id="lCopy">Скопіювати посилання</button>'+back+'</div>';
      const cp=$('lCopy'); cp.onclick=()=>{ const done=()=>{cp.textContent='Скопійовано';}; try{ navigator.clipboard.writeText(url).then(done,sel); }catch(e){ sel(); } function sel(){ const r=document.createRange(); r.selectNodeContents($('lUrl')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent='Виділено — скопіюй'; } };
      const sh=$('lShare'); if(sh) sh.onclick=()=>{ try{ navigator.share({title:'Агроволейбол',text:'Зіграймо у волейбол! Заходь:',url:url}).catch(()=>{}); }catch(e){} }; }
    $('lBack').onclick=()=>{ netClose(); G.mode='menu'; ui(); };
  } else if(G.mode==='over'){
    const w=G.score[0]>G.score[1]?0:1, L=G.flip?1:0, t=G.kind==='local'?'Переміг '+who(w).toLowerCase():(w===G.me?'Перемога!':'Поразка'), net=G.kind==='net';
    card.innerHTML='<span class="k">'+CH[G.P[L].ch].n+' проти: '+CH[G.P[1-L].ch].n+'</span><h3>'+t+'</h3><p class="code">'+G.score[L]+' : '+G.score[1-L]+'</p>'+
      (net&&G.again[1-G.me]&&!G.again[G.me]?'<p>Суперник хоче реванш.</p>':'')+(net&&G.again[G.me]?'<p>Чекаємо на суперника…</p>':'')+
      '<div class="btns"><button id="oAgain"'+(net&&G.again[G.me]?' disabled':'')+'>Реванш</button><button class="sec" id="oMenu">Змінити гравця</button></div>';
    $('oAgain').onclick=()=>{ if(G.kind==='net'){ G.again[G.me]=true; send({t:'ag'}); if(G.me===0&&G.again[1]){ const chs=[G.P[0].ch,G.P[1].ch]; send({t:'go',chs:chs}); startMatch('net',0,chs); } else ui(); } else startMatch(G.kind,G.me,[G.P[0].ch,G.P[1].ch]); };
    $('oMenu').onclick=()=>{ netClose(); G.mode='menu'; ui(); };
  } }
function hold(el,k){ const dn=e=>{e.preventDefault(); audioInit(); tin[k]=true; el.classList.add('on'); try{el.setPointerCapture(e.pointerId);}catch(_){}} , up=()=>{tin[k]=false; el.classList.remove('on');};
  el.addEventListener('pointerdown',dn); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up); el.addEventListener('contextmenu',e=>e.preventDefault()); }
hold($('bL'),'l'); hold($('bR'),'r');
$('bJ').addEventListener('pointerdown',e=>{e.preventDefault(); audioInit(); jq[0]=true; $('bJ').classList.add('on'); setTimeout(()=>$('bJ').classList.remove('on'),120);}); $('bJ').addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ if(G.mode!=='play')return; e.preventDefault(); audioInit(); });
const KM={ArrowLeft:'left',ArrowRight:'right',KeyA:'a',KeyD:'d'};
window.addEventListener('keydown',e=>{ if(G.mode!=='play')return; const k=KM[e.code]; if(k){key[k]=true;e.preventDefault();return;}
  if(e.repeat){ if(e.code==='ArrowUp'||e.code==='Space')e.preventDefault(); return; }
  if(e.code==='KeyW'){jq[0]=true;} else if(e.code==='ArrowUp'||e.code==='Space'){ jq[G.kind==='local'&&e.code==='ArrowUp'?1:0]=true; e.preventDefault(); } audioInit(); });
window.addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) key[k]=false; });
window.addEventListener('blur',()=>{ for(const k in key) key[k]=false; tin.l=tin.r=false; });
$('bSnd').onclick=()=>{sndOn=!sndOn; audioInit(); if(master) master.gain.value=sndOn?.9:0; $('bSnd').textContent='Звук: '+(sndOn?'увімк.':'вимк.'); $('bSnd').setAttribute('aria-pressed',sndOn?'true':'false');};
$('bMenu').onclick=()=>{ netClose(); G.mode='menu'; ui(); };
function setBig(v){ document.body.classList.toggle('big',v); $('bExit').hidden=!v;
  if(v){ const el=document.documentElement; try{ const r=(el.requestFullscreen||el.webkitRequestFullscreen); if(r){ const pr=r.call(el); if(pr&&pr.catch) pr.catch(()=>{}); } }catch(e){} }
  else { try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }catch(e){} }
  setTimeout(resize,60); }
$('bBig').onclick=()=>{audioInit(); setBig(true);}; $('bExit').onclick=()=>setBig(false);
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&document.body.classList.contains('big')) setBig(false); });
window.addEventListener('pagehide',()=>{ netClose(); });

/* ---------- цикл ---------- */
let last=0;
function frame(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(G.mode==='play'){ let r=dt; while(r>1e-5&&G.mode==='play'){ const s=Math.min(r,1/120); step(s); r-=s; } netFrame(dt); }
  else { G.t+=dt; if(G.kind==='net'&&conn) netFrame(dt); }
  draw(); requestAnimationFrame(frame); }
new ResizeObserver(resize).observe(cv); resize(); ui();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>draw());
requestAnimationFrame(frame);
if(isLoc) window.__v={setE:v=>{BOTE=v;},G:G,CH:CH,step:step,startMatch:startMatch,key:key,jq:jq,tin:tin,net:()=>({open:!!(conn&&conn.open),code:code,st:netState,msg:G.netMsg})};
})();
</script>
</body>

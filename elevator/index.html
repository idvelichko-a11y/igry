<!doctype html>
<html lang="uk" data-ver="2">
<head>

<title>Елеватор</title>
<meta name="description" content="Головоломка-сортування: розклади пшеницю, кукурудзу, соняшник по силосах. Зерно виходить знизу, вологе — в сушарку, засмічене — в сепаратор.">

<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
:root{--bg:#F2F4F4;--card:#FFFFFF;--fg:#2C3E50;--mute:#66767F;--line:#D5DCDE;--main:#1F4E5F;--accent:#C9A961;

:root[data-theme="dark"]{--bg:#10181B;--card:#18232A;--fg:#E6ECEE;--mute:#93A3AA;--line:#2A3940;--main:#86BACB;--accent:#D9BD7E;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;overscroll-behavior:none;
  padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

.stage{position:relative;background:#BFD9E8;border-radius:14px;overflow:hidden;aspect-ratio:16/9;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.card{background:var(--ov);color:var(--ov-fg);border-radius:14px;padding:14px 16px;max-width:640px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:9px;text-align:center}

.card .facts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center} .card .facts span{font-size:.76rem;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px;color:#E6EEF1}

.stars{font-size:2rem;letter-spacing:.12em;color:var(--star)} .stars .off{color:rgba(255,255,255,.2)}

.rows span{color:var(--ov-mute)} .rows b{text-align:right} .rows .bad{color:#FF9C8A} .rows .ok{color:#9FE3A5}

button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* гра на весь екран */
body.play{overflow:hidden;padding:0}

<body>
<div class="wrap">
  <header><p class="eyebrow"><a href="../" style="color:inherit">Поле зору · ігри</a></p><h1>Елеватор</h1></header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Елеватор: силоси зі зерном у розрізі"></canvas>
    <button id="bTop" hidden>⏸ Пауза</button>
    <div class="ov" id="ov"><div class="card" id="card"></div></div>
  </div>
  <div class="ctl" id="ctl" hidden>
    <button id="bUndo">↶<small>назад</small></button>
    <button id="bVent">❄<small>вентилювати</small></button>
    <button id="bRe">⟲<small>заново</small></button>
    <button id="bPause"><b style="letter-spacing:-1px">❚❚</b><small>пауза</small></button>
  </div>
  <div class="row2">
    <button id="bSnd" aria-pressed="true">Звук: увімк.</button>
    <span class="hint">Торкнись силосу, з якого брати, потім — куди сипати. Зерно виходить знизу силосу й засипається згори. На комп'ютері ще: Z — назад, V — вентилювати, R — заново, P — пауза.</span>
  </div>
</div>
<script>
/* Елеватор — правила. Один модуль для гри й для перевірки рівнів у node. */
(function(root){
"use strict";
/* культури: n — назва, col — колір, p — умовна ціна за тонну, sh — усушка при сушінні */
const CROPS={
 w2:{n:'Пшениця 2 кл.',s:'Пш 2',col:'#E2B84A',dk:'#B88E2A',p:265,sh:.05},
 w3:{n:'Пшениця 3 кл.',s:'Пш 3',col:'#D8A94F',dk:'#A87C30',p:235,sh:.05},
 ba:{n:'Ячмінь',s:'Ячм',col:'#E8DDA4',dk:'#B9AC6E',p:200,sh:.05},
 co:{n:'Кукурудза',s:'Кук',col:'#F0A030',dk:'#B86E12',p:190,sh:.08},
 su:{n:'Соняшник',s:'Сон',col:'#4A4A50',dk:'#26262B',p:480,sh:.06},
 ra:{n:'Ріпак',s:'Ріп',col:'#3B3026',dk:'#1E1712',p:520,sh:.05,fine:1},
 so:{n:'Соя',s:'Соя',col:'#E9D9A8',dk:'#B8A673',p:420,sh:.05},

const UNIT=100; // тонн в одній частці
function L(c,u,o){ o=o||{}; return {c:c,u:u,w:!!o.w,d:!!o.d,m:!!o.m,h:o.h||0,t:o.t!=null?o.t:u*UNIT}; }
function key(l){ return l.c+(l.w?'w':'')+(l.d?'d':'')+(l.m?'m':''); }
function used(k){ let s=0; for(const l of k.L) s+=l.u; return s; }
function free(k){ return k.cap-used(k); }
function clone(st){ return {K:st.K.map(k=>Object.assign({},k,{L:k.L.map(l=>Object.assign({},l))})),moves:st.moves,lost:Object.assign({},st.lost),gas:st.gas}; }
function needs(l){ return l.w||l.d||l.m||l.c==='sp'; }
/* чи можна перелити нижній шар з a в b; повертає причину відмови або '' */
function why(st,a,b,opt){ const A=st.K[a], B=st.K[b]; if(a===b) return 'same'; if(!A||!B) return 'none'; if(!A.L.length) return 'Тут порожньо';
  if(A.busy>0) return A.t==='dry'?'Сушарка ще працює':'Сепаратор ще працює'; if(B.busy>0) return B.t==='dry'?'Сушарка ще працює':'Сепаратор ще працює';
  if(B.t==='truck') return 'Машину розвантажують, а не навантажують'; if(A.t==='wagon') return 'З вагона не беремо';
  if(B.broken) return 'Сушарка на ремонті';
  const l=A.L[0]; if(B.t==='waste'&&l.c!=='sp') return 'Сюди — лише зіпсоване зерно'; if(B.t!=='waste'&&l.c==='sp') return 'Зіпсоване — тільки у відходи';
  if(B.crack&&CROPS[l.c].fine) return 'Ріпак дрібний — висиплеться крізь тріщину';
  if(B.t==='wagon'){ const o=B.ord; if(!o) return 'none'; if(l.c!==o.c) return 'Вагон чекає: '+CROPS[o.c].n; if(l.w) return 'Вагон не прийме вологе'; if(l.d||l.m) return 'Вагон не прийме засмічене'; if(o.left<=0) return 'Вагон уже повний'; return ''; }
  if(free(B)<=0) return 'Немає місця'; return ''; }
/* перелити нижній шар; змінює стан */
function move(st,a,b,opt){ opt=opt||{}; const A=st.K[a], B=st.K[b], l=A.L[0]; let amt=Math.min(l.u,B.t==='wagon'?B.ord.left:free(B)); const out=[];
  const whole=amt===l.u, above=A.L[1];
  const part=u=>{ const k=u/l.u; const p=Object.assign({},l,{u:u,t:l.t*k}); return p; };
  if(opt.podmes&&whole&&above&&key(above)!==key(l)&&A.t==='silo'&&B.t!=='waste'){ if(amt>1) out.push(part(amt-1)); const m=part(1); if(above.c!==l.c) m.m=true; out.push(m); }
  else out.push(part(amt));
  l.t-=l.t*amt/l.u; l.u-=amt; if(l.u<=0) A.L.shift();
  for(const p of out){ if(B.t==='dry'&&p.w){ const k=1-CROPS[p.c].sh; st.lost.dry=(st.lost.dry||0)+p.t*(1-k); p.t*=k; p.w=false; st.gas=(st.gas||0)+p.u; if(opt.timed) B.busy=opt.timed; }
    if(B.t==='clean'&&(p.d||p.m)){ st.lost.clean=(st.lost.clean||0)+p.t*.04; p.t*=.96; p.d=false; p.m=false; if(opt.timed) B.busy=opt.timed; }
    if(B.t==='waste'){ st.lost.spoil=(st.lost.spoil||0)+p.t; continue; }
    if(B.t==='wagon'){ B.ord.left-=p.u; B.ord.got+=p.t; continue; }
    p.h=0; const top=B.L[B.L.length-1]; if(top&&key(top)===key(p)&&top.c!=='sp'){ top.u+=p.u; top.t+=p.t; top.h=Math.max(top.h,p.h); } else B.L.push(p); }
  st.moves++; return out; }
/* нагрів вологого зерна в силосах; повертає список зіпсованих */
function heat(st,dh,limit){ const bad=[]; for(let i=0;i<st.K.length;i++){ const k=st.K[i]; if(k.t!=='silo') continue; for(const l of k.L){ if(l.w&&l.c!=='sp'){ l.h+=dh; if(l.h>=limit){ st.lost.spoil=(st.lost.spoil||0)+0; l.c='sp'; l.w=false; l.d=false; l.m=false; bad.push(i); } } } } return bad; }
/* розв'язано: у кожному силосі одна культура, чиста й суха, і кожна культура зібрана в одному силосі */
function solved(st){ const seen={}; for(const k of st.K){ if(k.t==='dry'||k.t==='clean'){ if(k.L.length) return false; continue; } if(k.t!=='silo') continue; if(!k.L.length) continue; const c=k.L[0].c; if(seen[c]) return false; seen[c]=1; for(const l of k.L){ if(l.c!==c||needs(l)) return false; } } return true; }
/* ---------- розв'язувач для перевірки рівнів (BFS) ---------- */
function enc(st){ const g={}; const parts=st.K.map(k=>(k.t+k.cap+(k.crack?'x':''))+':'+k.L.map(l=>key(l)+l.u).join(',')); const out=[]; // однакові силоси — порядок не важливий
  const sil=[], oth=[]; st.K.forEach((k,i)=>{ (k.t==='silo'?sil:oth).push(parts[i]); }); sil.sort(); return oth.join('|')+'#'+sil.join('|'); }
function solve(st0,opt,maxN){ maxN=maxN||400000; const start=clone(st0); start.moves=0; const seen=new Map(); seen.set(enc(start),null); let q=[start], depth=0, n=0;
  if(solved(start)) return {moves:0,path:[]};
  const par=new Map();
  while(q.length){ depth++; const nq=[]; for(const s of q){ const K=s.K; for(let a=0;a<K.length;a++){ const A=K[a]; if(!A.L.length) continue; if(A.t==='waste') continue;
        for(let b=0;b<K.length;b++){ if(why(s,a,b,opt)) continue; const B=K[b];
          if(A.t==='silo'&&B.t==='silo'&&!B.L.length&&A.L.length===1&&B.cap>=A.L[0].u&&!!B.crack===!!A.crack) continue; // переливати весь силос у такий самий порожній — марно
          const ns=clone(s); move(ns,a,b,opt); const e=enc(ns); if(seen.has(e)) continue; seen.set(e,1); par.set(ns,[s,a,b]); n++; if(solved(ns)){ const path=[]; let cur=ns; while(par.has(cur)){ const p=par.get(cur); path.unshift([p[1],p[2]]); cur=p[0]; } return {moves:depth,path:path,n:n}; } nq.push(ns); if(n>maxN) return {moves:-1,n:n}; } } }
    q=nq; } return {moves:-1,n:n}; }
/* швидкий пошук (зважений A*): знаходить короткий розв'язок для великих рівнів; число ходів — верхня межа */
function hEst(st){ let h=0; for(const k of st.K){ if(k.t==='dry'||k.t==='clean'){ h+=k.L.length; continue; } if(k.t!=='silo') continue; if(!k.L.length) continue; const c=k.L[0].c; let bad=false; for(const l of k.L){ if(l.c!==c) bad=true; if(needs(l)) h+=2; else if(bad) h+=1; } } return h; }
function solveA(st0,opt,maxN,w){ maxN=maxN||300000; w=w||1.4; const start=clone(st0); start.moves=0; if(solved(start)) return {moves:0,path:[]};
  const H=[]; const push=x=>{ H.push(x); let i=H.length-1; while(i>0){ const p=(i-1)>>1; if(H[p].f<=H[i].f) break; [H[p],H[i]]=[H[i],H[p]]; i=p; } };
  const pop=()=>{ const top=H[0], last=H.pop(); if(H.length){ H[0]=last; let i=0; for(;;){ const l=2*i+1, r=l+1; let m=i; if(l<H.length&&H[l].f<H[m].f) m=l; if(r<H.length&&H[r].f<H[m].f) m=r; if(m===i) break; [H[m],H[i]]=[H[i],H[m]]; i=m; } } return top; };
  const best=new Map(); best.set(enc(start),0); push({s:start,g:0,f:w*hEst(start),par:null,mv:null}); let n=0;
  while(H.length){ const cur=pop(); const s=cur.s, K=s.K; if(best.get(enc(s))<cur.g) continue;
    for(let a=0;a<K.length;a++){ const A=K[a]; if(!A.L.length||A.t==='waste') continue; for(let b=0;b<K.length;b++){ if(why(s,a,b,opt)) continue; const B=K[b];
      if(A.t==='silo'&&B.t==='silo'&&!B.L.length&&A.L.length===1&&B.cap>=A.L[0].u&&!!B.crack===!!A.crack) continue;
      const ns=clone(s); move(ns,a,b,opt); const e=enc(ns), g=cur.g+1; if(best.has(e)&&best.get(e)<=g) continue; best.set(e,g); n++;
      const node={s:ns,g:g,f:g+w*hEst(ns),par:cur,mv:[a,b]}; if(solved(ns)){ const path=[]; let c=node; while(c.par){ path.unshift(c.mv); c=c.par; } return {moves:g,path:path,n:n}; }
      push(node); if(n>maxN) return {moves:-1,n:n}; } } }
  return {moves:-1,n:n}; }
